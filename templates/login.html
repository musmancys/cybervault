{% extends "layout.html" %}

{% block main %}
    <h1>Log In</h1>
    <form action="/login" method="post" class="auth-form">
        <input name="username" placeholder="Username" type="text" required>
        <input name="password" placeholder="Password" type="password" required>
        <button type="submit">Log In</button>
    </form>
{% endblock %}
